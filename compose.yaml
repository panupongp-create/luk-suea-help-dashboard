services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: luk_suea
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d luk_suea"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [internal]

  migrate:
    build: .
    image: luk-suea-help-app:local
    restart: "no"
    command: ["node", "server/migrate.mjs"]
    environment:
      PGHOST: db
      PGDATABASE: luk_suea
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]

  app:
    image: luk-suea-help-app:local
    restart: unless-stopped
    environment:
      PGHOST: db
      PGDATABASE: luk_suea
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [internal]

  web:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [app]
    networks: [internal]

volumes:
  postgres_data:

networks:
  internal:
