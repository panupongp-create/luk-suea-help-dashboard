<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#6f2817">
  <meta name="robots" content="noindex">
  <title>ปิดปรับปรุงระบบ | ศูนย์อำนวยการลูกเสือ</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@500;600;700;800&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{font-family:"Sarabun",system-ui,sans-serif;color:#442d25;background:#f8f3ed}
    *{box-sizing:border-box}
    body{min-height:100vh;margin:0;display:grid;place-items:center;padding:22px;background:radial-gradient(circle at 75% 12%,#f2e3d3 0,transparent 36%),#f8f3ed}
    main{width:min(620px,100%);padding:clamp(28px,6vw,56px);border:1px solid #e7d8cb;border-radius:24px;background:#fffdfa;box-shadow:0 20px 60px rgba(91,50,30,.1);text-align:center}
    img{width:76px;height:76px;border-radius:18px}
    h1{margin:22px 0 12px;font-family:"Anuphan","Sarabun",sans-serif;font-size:clamp(1.7rem,5vw,2.4rem);line-height:1.3;color:#6f2817}
    p{margin:0 auto;max-width:490px;font-size:1.05rem;line-height:1.8}
    .note{margin-top:22px;padding:14px 18px;border-radius:12px;background:#f8eee5;color:#724633;font-size:.96rem}
    footer{margin-top:30px;color:#886e61;font-size:.88rem}
  </style>
</head>
<body>
  <main>
    <img src="assets/favicon.svg" alt="ตราลูกเสือ" width="76" height="76">
    <h1>ระบบปิดปรับปรุงชั่วคราว</h1>
    <p>ศูนย์อำนวยการลูกเสือช่วยเหลือผู้อื่นทุกเมื่อกำลังย้ายข้อมูลไปยังระบบใหม่ ขณะนี้เว็บไซต์เดิมหยุดรับคำร้อง ลงทะเบียน และเข้าสู่ระบบเจ้าหน้าที่ชั่วคราว</p>
    <p class="note">เมื่อการย้ายข้อมูลและตรวจสอบระบบเสร็จสิ้น จะแสดงลิงก์เว็บไซต์ใหม่ที่หน้านี้</p>
    <footer>ขออภัยในความไม่สะดวก</footer>
  </main>
</body>
</html>
