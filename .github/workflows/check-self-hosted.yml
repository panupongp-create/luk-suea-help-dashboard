name: Check self-hosted Docker stack
on:
  push:
    branches: [main]
  pull_request:
jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-postgres-password-only
      APP_DB_PASSWORD: ci-app-password-only
      HTTP_PORT: "80"
    steps:
      - uses: actions/checkout@v4
      - name: Validate and build
        run: |
          docker compose config --quiet
          docker compose build
      - name: Boot fresh PostgreSQL and app
        run: docker compose up -d
      - name: Check health and static config
        run: |
          curl --fail --retry 15 --retry-delay 2 --retry-all-errors http://127.0.0.1/healthz
          curl --fail -H 'Host: www.AGER_DD-01.moe.go.th' http://127.0.0.1/healthz | grep '"status":"ok"'
          curl --fail http://127.0.0.1/config.js | grep 'BACKEND_MODE: "server"'
          curl --fail http://127.0.0.1/api/public-requests | grep '"data":\[\]'
          curl --fail -H 'Content-Type: application/json' -d '{}' http://127.0.0.1/api/rpc/get_public_volunteer_stats | grep '"group_no":1'
      - name: Validate optional Nginx HTTPS config with an ephemeral test certificate
        run: |
          mkdir -p certs
          cp nginx/https.conf.example nginx/https.conf
          openssl req -x509 -nodes -newkey rsa:2048 -keyout certs/privkey.pem -out certs/fullchain.pem -days 1 -subj '/CN=example.org' >/dev/null 2>&1
          docker compose -f compose.yaml -f compose.https.yaml config --quiet
          docker compose -f compose.yaml -f compose.https.yaml run --rm --no-deps web nginx -t
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=100
