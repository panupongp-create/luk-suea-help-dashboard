name: Check self-hosted Docker stack
on:
  push:
    branches: [main]
  pull_request:
jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-postgres-password-only
      APP_DB_PASSWORD: ci-app-password-only
      SITE_ADDRESS: ":80"
    steps:
      - uses: actions/checkout@v4
      - name: Validate and build
        run: |
          docker compose config --quiet
          docker compose build
      - name: Boot fresh PostgreSQL and app
        run: docker compose up -d
      - name: Check health and static config
        run: |
          curl --fail --retry 15 --retry-delay 2 --retry-connrefused http://127.0.0.1/healthz
          curl --fail http://127.0.0.1/config.js | grep 'BACKEND_MODE: "server"'
          curl --fail http://127.0.0.1/api/public-requests | grep '"data":\[\]'
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=100
